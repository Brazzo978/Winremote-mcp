name: Rust Windows
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python tests/smoke.py --exe target/debug/winremote-mcp.exe --allow-headless
      - run: python tests/desktop_smoke.py --exe target/debug/winremote-mcp.exe --allow-headless
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: winremote-mcp-windows
          path: target/release/winremote-mcp.exe
