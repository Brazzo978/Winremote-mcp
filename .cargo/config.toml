# Keep the distributed executable independent of compiler runtime DLLs.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-gnullvm]
rustflags = ["-C", "target-feature=+crt-static"]

# Tier 3 target: cargo +nightly -Z build-std --target x86_64-win7-windows-msvc.
# Rebuild std with the same static CRT setting as the application.
[target.x86_64-win7-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
